<!doctype html>
<html><head><meta charset="utf-8"><title>Engineer's Notebook</title>
<style>
@font-face{font-family:Kalam;font-weight:700;src:url(../fonts/Kalam-700.woff)}
@font-face{font-family:Inter;font-weight:100 900;src:url(../fonts/Inter-var.woff)}
html,body{margin:0;background:#222}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../tools/lib.js"></script>
<script>
const T = __TIMING__;
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#1b1c20', RED = '#d93a2b', BLUE = '#2456d6', PAPER = '#f7f2e6';
const EV = []; window.EV = EV;

// ---------- paper: squared engineer's pad under a warm desk lamp ----------
let paper;
function bakePaper() {
  paper = document.createElement('canvas'); paper.width = W + 120; paper.height = H + 120;
  const g = paper.getContext('2d'); g.translate(60, 60);
  g.fillStyle = PAPER; g.fillRect(-60, -60, W + 120, H + 120);
  // formation clouds
  const r = L.rng(41);
  for (let i = 0; i < 90; i++) { const x = r() * W, y = r() * H, rr = 60 + r() * 200; const gr = g.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, `rgba(${r() < .5 ? '150,130,100' : '255,255,250'},${.025 + r() * .02})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - rr, y - rr, rr * 2, rr * 2); }
  // squared grid (5 mm feel), every 5th a touch stronger
  const S = 46, ox = 22, oy = 14;
  for (let i = -2; i * S < W + 60; i++) { g.fillStyle = i % 5 === 0 ? 'rgba(70,110,150,.20)' : 'rgba(70,110,150,.12)'; g.fillRect(ox + i * S, -60, i % 5 === 0 ? 1.6 : 1.1, H + 120); }
  for (let j = -2; j * S < H + 60; j++) { g.fillStyle = j % 5 === 0 ? 'rgba(70,110,150,.20)' : 'rgba(70,110,150,.12)'; g.fillRect(-60, oy + j * S, W + 120, j % 5 === 0 ? 1.6 : 1.1); }
  // margin rule
  g.fillStyle = 'rgba(200,70,60,.42)'; g.fillRect(106, -60, 2.2, H + 120); g.fillStyle = 'rgba(200,70,60,.22)'; g.fillRect(111, -60, 1.2, H + 120);
  // fibres
  g.strokeStyle = 'rgba(120,100,80,.10)'; g.lineWidth = 1;
  for (let i = 0; i < 260; i++) { const x = r() * W, y = r() * H, a = r() * 6.28, l = 4 + r() * 12; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + (r() - .5) * 4, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  // grain
  g.globalCompositeOperation = 'multiply'; g.globalAlpha = .06; const n = L.noiseCanvas(540, 960, 9, 60, 200); g.drawImage(n, -60, -60, W + 120, H + 120); g.globalAlpha = 1;
  // warm desk lamp from upper left, falloff to lower right
  const lamp = g.createRadialGradient(180, 120, 80, 260, 300, 1900);
  lamp.addColorStop(0, 'rgba(255,250,238,1)'); lamp.addColorStop(.5, 'rgba(252,242,222,1)'); lamp.addColorStop(1, 'rgba(226,206,172,1)');
  g.fillStyle = lamp; g.fillRect(-60, -60, W + 120, H + 120);
  g.globalCompositeOperation = 'source-over';
  const warm = g.createRadialGradient(200, 160, 0, 200, 160, 900); warm.addColorStop(0, 'rgba(255,214,150,.12)'); warm.addColorStop(1, 'rgba(255,214,150,0)'); g.fillStyle = warm; g.fillRect(-60, -60, W + 120, H + 120);
}

// ---------- marker ink ----------
function ink(s, upTo, col, b) {
  if (upTo <= 0) return; const w = s.o.w;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = .16; ctx.lineWidth = w * 1.14; s.path(ctx, upTo, b); ctx.stroke();               // soft wet edge
  ctx.globalAlpha = col === INK ? .88 : .8; ctx.lineWidth = w; s.path(ctx, upTo, b); ctx.stroke();      // body
  ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = '#fbf6ea'; ctx.globalAlpha = .10; ctx.lineWidth = Math.max(1.2, w * .16);
  ctx.translate(w * .16, -w * .1); s.path(ctx, upTo, b); ctx.stroke();                              // dry streak of the felt tip
  // touch-down density
  const p0 = s.vars[b % 3][0]; ctx.translate(-w * .16, w * .1); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .25; ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(p0[0], p0[1], w * .55, 0, 6.29); ctx.fill();
  ctx.restore();
}

// ---------- timeline ----------
const E = [];
let seed = 100;
function S(t0, t1, pts, o = {}) { const s = new L.Stroke(pts, Object.assign({ w: 11, seed: seed++ }, o)); E.push({ t0, t1, k: 's', s, col: o.col || INK }); EV.push({ t: t0, d: t1 - t0, kind: o.kind || 'stroke', x: pts[0][0] / W, col: o.col || 'k' }); return s; }
function Wr(t0, cps, hand, col = INK) { E.push({ t0, k: 'w', h: hand, cps, col }); EV.push({ t: t0, d: hand.n / cps, kind: 'write', x: hand.x0 / W }); }

function build() {
  // question, written as it is asked (VO 0.80-2.53)
  const q1 = new L.Hand(ctx, 'How much advance', 150, 395, { size: 104, seed: 3 });
  const q2 = new L.Hand(ctx, 'is fair?', 150, 515, { size: 104, seed: 4 });
  Wr(.62, 12.5, q1); Wr(1.95, 12, q2);
  // circled Q in the margin
  // underline under "fair?"
  S(2.62, 2.85, [[318, 540], [400, 546], [470, 540], [528, 545]], { w: 7 });

  // big rupee sign (black) + the unknown in red
  const rx = 160, ry = 640;
  S(2.75, 2.9, [[rx, ry], [rx + 250, ry + 2]], { w: 16, smooth: false });
  S(2.9, 3.02, [[rx, ry + 66], [rx + 250, ry + 64]], { w: 16, smooth: false });
  S(3.02, 3.28, [[rx + 80, ry + 2], [rx + 175, ry + 14], [rx + 212, ry + 62], [rx + 190, ry + 112], [rx + 120, ry + 136], [rx + 20, ry + 138]], { w: 16 });
  S(3.28, 3.45, [[rx + 30, ry + 140], [rx + 140, ry + 228], [rx + 232, ry + 300]], { w: 16, smooth: false });
  S(3.42, 3.66, [[470, 690], [482, 640], [530, 616], [578, 640], [584, 690], [548, 728], [526, 770], [526, 812]], { w: 15, col: RED });
  S(3.66, 3.72, L.arcPts(527, 872, 5, 5, 0, 6.28, 12), { w: 15, col: RED, smooth: false });

  // the guess bubble ("guess a number" 3.46-4.52) ... then scribbled out
  const bx = 786, by = 700;
  S(3.5, 3.9, L.arcPts(bx, by, 148, 94, -2.9, 3.48, 60), { w: 9 });
  S(3.88, 3.94, L.arcPts(632, 812, 13, 13, 0, 6.28, 14), { w: 8, smooth: false });
  S(3.94, 3.99, L.arcPts(606, 848, 8, 8, 0, 6.28, 12), { w: 7, smooth: false });
  const gs = new L.Hand(ctx, 'a guess?', bx, by + 22, { size: 70, align: 'center', seed: 5 }); Wr(3.72, 16, gs);
  const zig = []; for (let i = 0; i <= 11; i++) zig.push([bx - 128 + i * 23, by - 12 + (i % 2 ? 34 : -26) + (i % 3) * 3]);
  S(4.28, 4.55, zig, { w: 12, smooth: false, kind: 'scribble', wob: .6 });
  S(4.6, 4.72, [[bx - 140, by - 98], [bx + 140, by + 100]], { w: 13, smooth: false, kind: 'cross' });
  S(4.74, 4.86, [[bx + 140, by - 98], [bx - 140, by + 100]], { w: 13, smooth: false, kind: 'cross' });
  const no = new L.Hand(ctx, 'no.', bx + 70, by + 160, { size: 52, seed: 12 }); Wr(4.92, 10, no);

  // arrow to the list ("covers" ~5.90)
  S(5.05, 5.42, [[230, 960], [214, 1000], [222, 1040], [252, 1066]], { w: 9 });
  S(5.42, 5.5, [[214, 1062], [254, 1068], [244, 1030]], { w: 9, smooth: false });
  const lh = new L.Hand(ctx, 'What does it cover?', 270, 1078, { size: 56, seed: 6 }); Wr(5.5, 20, lh);
  // checklist (questions only - no numbers, no rules)
  const items = ['which work?', 'which material?', 'by when?'];
  items.forEach((it, i) => {
    const y = 1170 + i * 64, t0 = 6.25 + i * .34;
    S(t0, t0 + .12, [[170, y - 32], [204, y - 33], [205, y + 1], [171, y + 2], [170, y - 30]], { w: 5, col: BLUE, smooth: false });
    const h = new L.Hand(ctx, it, 226, y, { size: 46, seed: 20 + i }); Wr(t0 + .1, 26, h);
  });

  // signed paper + pen ("writing" 7.13), then the red tick
  const pc = [826, 1212], ang = -.08, pw = 196, ph = 238;
  const R = (x, y) => [pc[0] + x * Math.cos(ang) - y * Math.sin(ang), pc[1] + x * Math.sin(ang) + y * Math.cos(ang)];
  S(6.85, 7.2, [R(-pw / 2, -ph / 2), R(pw / 2, -ph / 2), R(pw / 2, ph / 2), R(-pw / 2, ph / 2), R(-pw / 2 - 2, -ph / 2 + 3)], { w: 8, smooth: false });
  [-.32, -.2, -.08, .04].forEach((f, i) => S(7.2 + i * .07, 7.27 + i * .07, [R(-pw / 2 + 28, f * ph), R(pw / 2 - (i === 3 ? 90 : 30), f * ph)], { w: 4.5, smooth: false, kind: 'hatch' }));
  // signature squiggle
  const sg = []; for (let i = 0; i <= 26; i++) { const u = i / 26; sg.push(R(-62 + u * 112, 72 + Math.sin(u * 13) * 18 - u * 10 + (i % 4 === 0 ? -10 : 0))); }
  S(7.5, 7.85, sg, { w: 5, kind: 'sign' });
  S(7.48, 7.52, [R(-70, 96), R(64, 96)], { w: 3.5, smooth: false });
  // the pen lying across the corner
  S(7.7, 7.86, [[900, 1336], [944, 1238]], { w: 7, smooth: false });
  S(7.78, 7.94, [[922, 1344], [962, 1252]], { w: 7, smooth: false });
  S(7.9, 7.98, [[900, 1336], [906, 1358], [922, 1344]], { w: 6, smooth: false });
  // red tick - the answer, last stroke on the sheet, held
  S(8.05, 8.35, [[712, 1182], [752, 1222], [776, 1252], [826, 1172], [884, 1096]], { w: 17, col: RED, kind: 'tick' });
  // last red circle around the instruction
  window.EVEND = 8.35;
}

// ---------- captions on a torn slip ----------
function wrapWords(words, size, maxW) {
  ctx.font = `700 ${size}px Kalam`; const rows = [[]]; let w = 0; const sp = ctx.measureText(' ').width;
  for (const x of words) { const ww = ctx.measureText(x.w).width; if (w + ww > maxW && rows[rows.length - 1].length) { rows.push([]); w = 0; } rows[rows.length - 1].push(Object.assign({ ww }, x)); w += ww + sp; }
  return { rows, sp };
}
let slip;
function bakeSlip() {
  slip = document.createElement('canvas'); slip.width = 900; slip.height = 190; const g = slip.getContext('2d'); const r = L.rng(77);
  g.beginPath(); g.moveTo(14, 8); g.lineTo(886, 4);
  for (let y = 4; y < 186; y += 9) g.lineTo(880 + r() * 14, y); g.lineTo(888, 186); g.lineTo(10, 184);
  for (let y = 184; y > 8; y -= 9) g.lineTo(4 + r() * 14, y); g.closePath();
  g.fillStyle = 'rgba(251,248,239,.97)'; g.fill(); g.strokeStyle = 'rgba(60,50,40,.35)'; g.lineWidth = 1; g.stroke();
  g.globalCompositeOperation = 'source-atop'; g.globalAlpha = .05; g.drawImage(L.noiseCanvas(450, 95, 3, 80, 128), 0, 0, 900, 190);
  // washi tape corner
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.save(); g.translate(60, 10); g.rotate(-.5); g.fillStyle = 'rgba(36,86,214,.20)'; g.fillRect(-46, -14, 92, 28); g.restore();
}
function captions(t) {
  const first = T.lines[0], last = T.lines[T.lines.length - 1];
  if (t < first.start - .15 || t > last.end + .7) return;
  let line = null; for (const l of T.lines) if (t >= l.start - .15) line = l;
  const a = Math.min(L.prog(t, first.start - .15, first.start + .05), 1 - L.prog(t, last.end + .5, last.end + .7));
  const y0 = 1378 + (1 - L.eo(a)) * 8;
  ctx.save(); ctx.globalAlpha = a; ctx.drawImage(slip, 70, y0);
  const size = line.words.length > 6 ? 50 : 54; const { rows, sp } = wrapWords(line.words, size, 780);
  const lh = size * 1.12, top = y0 + 95 - (rows.length - 1) * lh / 2 + size * .33;
  rows.forEach((row, ri) => {
    const rw = row.reduce((s, x) => s + x.ww, 0) + sp * (row.length - 1); let x = 520 - rw / 2; const y = top + ri * lh;
    for (const wd of row) { const on = t >= wd.s - .04; ctx.fillStyle = INK; ctx.globalAlpha = a * (on ? .94 : .26); ctx.font = `700 ${size}px Kalam`; ctx.fillText(wd.w, x, y);
      x += wd.ww + sp; }
  });
  ctx.restore();
}

// ---------- frame ----------
function renderAt(t) {
  const td = Math.floor(t * 15 + 1e-6) / 15, b = Math.floor(t * 12) % 3;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#e9dcc4'; ctx.fillRect(0, 0, W, H);
  // camera: a slow lean in toward the page centre
  const z = 1 + .035 * L.eio(L.prog(t, 0, 10)), cx = 540, cy = 860;
  ctx.setTransform(z, 0, 0, z, cx - cx * z, cy - cy * z);
  ctx.drawImage(paper, -60, -60);
  for (const e of E) {
    if (e.k === 's') { const p = L.prog(td, e.t0, e.t1); if (p > 0) ink(e.s, p < 1 ? L.eio(p) * .7 + p * .3 : 1, e.col, b); }
    else { const p = L.wp(td, e.t0, e.cps, e.h.n); if (p > 0) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; e.h.draw(ctx, p, e.col, .93); ctx.restore(); } }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // printed style label (screen space)
  ctx.save(); ctx.fillStyle = 'rgba(40,36,30,.62)'; ctx.font = '600 25px Inter'; ctx.letterSpacing = '4px'; ctx.fillText("STYLE 04 · ENGINEER'S NOTEBOOK", 110, 140);
  ctx.fillStyle = 'rgba(40,36,30,.42)'; ctx.font = '500 21px Inter'; ctx.letterSpacing = '3px'; ctx.fillText('SERIES: ASK BNB', 110, 176); ctx.restore();
  captions(t);
}
window.ready = (async () => { await document.fonts.load('700 50px Kalam'); await document.fonts.load('600 20px Inter'); bakePaper(); bakeSlip(); build(); renderAt(0); })();
window.renderAt = renderAt;
</script></body></html>
