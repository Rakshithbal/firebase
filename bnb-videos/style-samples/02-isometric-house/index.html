<!doctype html>
<html><head><meta charset="utf-8"><title>STYLE 02 · Isometric 3D house</title>
<style>html,body{margin:0;background:#F3EEE4;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
THREE.ColorManagement.enabled = false;
const W = 1080, H = 1920, SS = 2;
const TM = await (await fetch('timing.json')).json();
window.DUR = TM.total;

// ---------- palette (Isometric Infographic: pale ground, flat hues, one ink) ----------
const GROUND = '#F3EEE4', INK = '#2B2433', DOT = '#DCD2C2';
const HEX = { wall: '#ECE4D6', plinth: '#D9D2C6', grass: '#A9C784', soil: '#B88A5E', gravel: '#8F8A84',
  living: '#EC8B6C', kitchen: '#EDB84C', bed: '#A99BD8', toilet: '#5DB7B4', stairs: '#7F98C2', passage: '#E3DACB',
  roof: '#CFC8BD', step: '#B9C6DD', glass: '#6F8FB8' };
const v3 = h => { const n = parseInt(h.slice(1), 16); return new THREE.Vector3((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255); };

// ---------- easing ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => cl((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const back = (x, s = 1.9) => { x = cl(x); const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };

// ---------- three.js: flat three-tone isometric ----------
const gl = document.createElement('canvas'); gl.width = W * SS; gl.height = H * SS;
const R = new THREE.WebGLRenderer({ canvas: gl, antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W * SS, H * SS, false); R.outputColorSpace = THREE.LinearSRGBColorSpace; R.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const VS = `varying vec3 vN; void main(){ vN = normalize(mat3(modelMatrix)*normal); gl_Position = projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.); }`;
const FS = `uniform vec3 base; varying vec3 vN;
void main(){ vec3 top = mix(base, vec3(1.,.985,.95), .24); vec3 mid = mix(base, vec3(.137,.102,.173), .07); vec3 dark = mix(base, vec3(.137,.102,.173), .26);
  vec3 c = vN.y > .5 ? top : (vN.y < -.5 ? dark : (abs(vN.x) > abs(vN.z) ? dark : mid)); gl_FragColor = vec4(c, 1.); }`;
const mats = {};
const mat = k => mats[k] || (mats[k] = new THREE.ShaderMaterial({ uniforms: { base: { value: v3(HEX[k]) } }, vertexShader: VS, fragmentShader: FS }));
const UB = new THREE.BoxGeometry(1, 1, 1).translate(.5, .5, .5);   // unit box with its min corner at the origin
const root = new THREE.Group(); scene.add(root);
function box(k, x0, y0, z0, sx, sy, sz, parent = root) { const m = new THREE.Mesh(UB, mat(k)); m.position.set(x0, y0, z0); m.scale.set(sx, sy, sz); parent.add(m); m.userData.b = [x0, y0, z0, sx, sy, sz]; return m; }

// board with strata (front faces show grass / soil / gravel)
const board = new THREE.Group(); root.add(board);
box('gravel', -2.5, -3.1, -2.5, 25, .8, 35, board); box('soil', -2.5, -2.3, -2.5, 25, 1.8, 35, board); box('grass', -2.5, -.5, -2.5, 25, .5, 35, board);
box('plinth', 0, 0, 0, 20, .5, 30, board);
const Y0 = .5;   // top of the plot plinth

// walls: [x0,z0,x1,z1]
const WALLS = [
  [0, 0, 20, .75], [0, .75, .75, 29.25], [19.25, .75, 20, 29.25], [0, 29.25, 10, 30], [13, 29.25, 20, 30],
  [.75, 10.8, 7, 11.25], [9.5, 10.8, 12, 11.25], [14.5, 10.8, 19.25, 11.25], [9.8, .75, 10.25, 10.8],
  [5.8, 11.25, 6.25, 13], [5.8, 15.5, 6.25, 18.25], [.75, 17.8, 5.8, 18.25], [6.8, 18.25, 7.25, 23.5],
  [11.8, 11.25, 12.25, 15], [12.25, 18.8, 15, 19.25], [17.5, 18.8, 19.25, 19.25]];
const walls = WALLS.map(([x0, z0, x1, z1]) => {
  const m = box('wall', x0, Y0, z0, x1 - x0, 1, z1 - z0, board);
  const d = Math.hypot((x0 + x1) / 2, (z0 + z1) / 2) / 36;   // wave from the back corner
  return { m, d };
});
// rooms: floor tile, label, pin direction
const ROOMS = [
  { k: 'living', n: 'LIVING', r: [7.25, 19.25, 19.25, 29.25], t: 3.55, dir: 1, up: 130 },
  { k: 'kitchen', n: 'KITCHEN', r: [12.25, 11.25, 19.25, 18.8], t: 4.15, dir: 1, up: 200 },
  { k: 'bed', n: 'BEDROOM', r: [.75, .75, 9.8, 10.8], t: 4.75, dir: -1, up: 300 },
  { k: 'bed', n: 'BEDROOM', r: [10.25, .75, 19.25, 10.8], t: 5.3, dir: 1, up: 330 },
  { k: 'toilet', n: 'TOILET', r: [.75, 11.25, 5.8, 17.8], t: 5.85, dir: -1, up: 185 },
  { k: 'stairs', n: 'STAIRS', r: [.75, 18.25, 6.8, 29.25], t: 6.4, dir: -1, up: 105 }];
const passage = box('passage', 6.25, Y0 - .4, 11.25, 5.55, .3, 7.55, board);
for (const R_ of ROOMS) { const [x0, z0, x1, z1] = R_.r; R_.m = box(R_.k, x0, Y0 - .4, z0, x1 - x0, .3, z1 - z0, board); }
// stairs: one straight flight, cut at the plan height
const STEPS = []; for (let i = 0; i < 9; i++) STEPS.push(box('step', .75, Y0, 28.4 - i * .95, 3.1, 1, .95, board));
// windows with sunshades (chajja) on the two outer walls we see, they come with the full-height rise
const WIN = [];
for (const [z0, z1] of [[3, 7], [13.5, 16.5], [22, 27]]) { WIN.push(box('glass', 19.98, Y0 + 3.6, z0, .14, 3.4, z1 - z0, board)); WIN.push(box('roof', 19.9, Y0 + 7.1, z0 - .4, 1.1, .3, z1 - z0 + .8, board)); }
for (const [x0, x1] of [[2.5, 6], [15, 18.5]]) { WIN.push(box('glass', x0, Y0 + 3.6, 29.98, x1 - x0, 3.4, .14, board)); WIN.push(box('roof', x0 - .4, Y0 + 7.1, 29.9, x1 - x0 + .8, .3, 1.1, board)); }
WIN.push(box('roof', 9.6, Y0 + 7.4, 29.9, 3.8, .3, 1.3, board));
// roof slab + parapet
const roof = new THREE.Group(); board.add(roof);
box('roof', -.5, 0, -.5, 21, .7, 31, roof);
box('roof', -.5, .7, -.5, 21, .55, .35, roof); box('roof', -.5, .7, 30.15, 21, .55, .35, roof);
box('roof', -.5, .7, -.15, .35, .55, 30.3, roof); box('roof', 20.15, .7, -.15, .35, .55, 30.3, roof);

// camera: true isometric, the projection never rotates; drift = pan + log zoom
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -500, 500);
const DIR = new THREE.Vector3(1, 1, 1).normalize();
const CX = 482, CY = 805;     // where the camera centre sits on screen (content area is x 0..960, y 230..1340)
function setCam(t) {
  const u = eio(lin(t, 0, 10));
  const k = Math.exp(Math.log(21.2) + (Math.log(22.4) - Math.log(21.2)) * u);
  const c = new THREE.Vector3(10 + .8 * (1 - u), 3.2 + 1.2 * u, 15 - .8 * (1 - u));
  cam.left = -CX / k; cam.right = (W - CX) / k; cam.top = CY / k; cam.bottom = -(H - CY) / k; cam.updateProjectionMatrix();
  cam.position.copy(c).addScaledVector(DIR, 200); cam.lookAt(c); cam.updateMatrixWorld();
}
const P = new THREE.Vector3();
const scr = (x, y, z) => { P.set(x, y, z).applyMatrix4(board.matrixWorld).project(cam); return [(P.x + 1) / 2 * W, (1 - P.y) / 2 * H]; };

// ---------- 2D ----------
const cv = document.getElementById('c'), g = cv.getContext('2d');
const F = (w, s) => `${w} ${s}px Inter, sans-serif`;
function halo(txt, x, y, font, col = INK, hw = 7, align = 'left', track = 0) {
  g.font = font; g.textAlign = align; g.textBaseline = 'middle'; g.letterSpacing = track + 'px';
  g.lineJoin = 'round'; g.strokeStyle = GROUND; g.lineWidth = hw * 2; g.strokeText(txt, x, y); g.fillStyle = col; g.fillText(txt, x, y); g.letterSpacing = '0px';
}
function background() {
  g.fillStyle = GROUND; g.fillRect(0, 0, W, H);
  g.fillStyle = DOT; const dx = 46, dy = dx * Math.tan(Math.PI / 6);
  for (let j = 0, y = 0; y < H + dy; j++, y += dy) for (let x = (j % 2) * dx / 2; x < W; x += dx) { g.beginPath(); g.arc(x, y, 2, 0, 7); g.fill(); }
}
function isoCube(x, y, s) {   // tiny legend chip
  const c = Math.cos(Math.PI / 6) * s, h = s / 2;
  const f = (pts, col) => { g.beginPath(); pts.forEach(([a, b], i) => i ? g.lineTo(x + a, y + b) : g.moveTo(x + a, y + b)); g.closePath(); g.fillStyle = col; g.fill(); };
  f([[0, -s], [c, -h], [0, 0], [-c, -h]], '#F4A487'); f([[-c, -h], [0, 0], [0, s], [-c, h]], '#E07E60'); f([[c, -h], [0, 0], [0, s], [c, h]], '#B6604B');
}
// dimension line along a world edge (on the board top), text kept upright and aligned with the edge
function dimLine(a, b, label, p, side) {
  if (p <= 0) return;
  const A = scr(...a), B = scr(...b); const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
  const e = eio(cl(p * 1.6)); const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
  const a0 = [mx - ux * L / 2 * e, my - uy * L / 2 * e], b0 = [mx + ux * L / 2 * e, my + uy * L / 2 * e];
  g.strokeStyle = INK; g.lineWidth = 2.4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(...a0); g.lineTo(...b0); g.stroke();
  // ticks: vertical in world (short), the iso convention
  const tk = cl(p * 2.2 - .6) * 14; for (const q of [a0, b0]) { g.beginPath(); g.moveTo(q[0], q[1] - tk); g.lineTo(q[0], q[1] + tk); g.stroke(); }
  const tp = cl(p * 2 - .8); if (tp <= 0) return;
  g.save(); g.translate(mx, my); let ang = Math.atan2(dy, dx); if (ang > Math.PI / 2) ang -= Math.PI; if (ang < -Math.PI / 2) ang += Math.PI; g.rotate(ang);
  g.font = F(600, 34); const tw = g.measureText(label).width + 26;
  g.beginPath(); g.rect(-tw / 2, -30, tw * eout(tp), 60); g.clip();
  g.fillStyle = GROUND; g.fillRect(-tw / 2, -22, tw, 44);
  halo(label, 0, 1, F(600, 34), INK, 4, 'center', 1); g.restore();
}
function pin(sx, sy, up, dir, label, p) {   // dot -> vertical leader -> rule -> text
  if (p <= 0) return;
  const lead = eout(cl(p / .45)) * up, rule = eout(lin(p, .35, .7)) * 34, tp = eout(lin(p, .5, 1));
  g.strokeStyle = INK; g.lineWidth = 2.2; g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx, sy - lead); if (rule > 0) g.lineTo(sx + dir * rule, sy - up); g.stroke();
  g.beginPath(); g.arc(sx, sy, 7.5 * back(cl(p / .25)), 0, 7); g.fillStyle = '#FFFDF8'; g.fill(); g.lineWidth = 3; g.stroke();
  if (tp > 0) {
    g.save(); g.font = F(600, 31); g.letterSpacing = '4px'; const tw = g.measureText(label).width; g.letterSpacing = '0px';
    const x0 = dir > 0 ? sx + 44 : sx - 44 - tw; g.beginPath(); g.rect(x0 - 12, sy - up - 30, (tw + 24) * tp, 60); g.clip();
    halo(label, x0, sy - up + 1, F(600, 31), INK, 7, 'left', 4); g.restore();
  }
}
function caption(t) {
  const words = TM.words; const chunks = [words.slice(0, 5), words.slice(5)];
  const t0s = [chunks[0][0].s - .15, chunks[1][0].s - .15], t1s = [chunks[1][0].s - .15, Math.max(chunks[1].at(-1).e + .9, chunks[1][0].s + 2.0)];
  for (let i = 0; i < 2; i++) {
    const a = t0s[i], b = t1s[i]; if (t < a || t > b) continue;
    const p = lin(t, a, a + .3), q = 1 - lin(t, b - .25, b);
    g.font = F(500, 46); const txt = chunks[i].map(w => w.w).join(' '); const tw = g.measureText(txt).width;
    const bw = tw + 120, bh = 104, cx = 480, cy = 1468, x = cx - bw / 2, y = cy - bh / 2;
    g.save(); const sh = eout(Math.min(p, q));
    g.translate(cx, cy); g.scale(.94 + .06 * sh, .94 + .06 * sh); g.translate(-cx, -cy); g.globalAlpha = sh;
    g.fillStyle = '#FFFDF8'; g.beginPath(); g.roundRect(x, y, bw, bh, 16); g.fill();
    // border draws first
    g.strokeStyle = INK; g.lineWidth = 3; g.setLineDash([2 * (bw + bh) * eout(lin(t, a, a + .35)), 4000]); g.stroke(); g.setLineDash([]);
    isoCube(x + 44, cy, 15);
    let xx = x + 82; g.textBaseline = 'middle'; g.textAlign = 'left';
    for (const w of chunks[i]) { const on = t >= w.s - .05; g.fillStyle = on ? INK : 'rgba(43,36,51,.28)'; g.fillText(w.w, xx, cy + 2); xx += g.measureText(w.w + ' ').width; }
    g.restore();
  }
}

// ---------- the timeline ----------
function pose(t) {
  // board rises into place (motion, not alpha), small squash on landing
  const bp = lin(t, 0, .85); board.position.y = -16 * (1 - back(bp, 1.3));
  const land = Math.exp(-((t - .85) ** 2) / .012) * .03; board.scale.set(1 + land, 1 - land * 1.5, 1 + land);
  // walls extrude in a wave to the cut height, then rise to full height before the roof
  for (const w of walls) {
    const a = eio(lin(t, 1.95 + w.d * 1.1, 2.45 + w.d * 1.1)), b = eio(lin(t, 7.7 + w.d * .55, 8.25 + w.d * .55));
    const h = 4.6 * a + 5.6 * b; w.m.visible = h > .02; w.m.scale.y = Math.max(h, .001);
  }
  passage.position.y = Y0 - .4 + .43 * back(lin(t, 2.6, 3.0));
  for (const R_ of ROOMS) R_.m.position.y = Y0 - .4 + .45 * back(lin(t, R_.t, R_.t + .32), 2.4);
  STEPS.forEach((s, i) => { const p = back(lin(t, 6.45 + i * .07, 6.75 + i * .07), 1.6); s.visible = p > .01; s.scale.y = Math.max(.001, (i + 1) * .5 * p); });
  WIN.forEach((m, i) => { const p = back(lin(t, 8.05 + (i % 6) * .04, 8.35 + (i % 6) * .04), 1.5); m.visible = p > .01; m.scale.x = m.userData.b[3] * Math.max(p, .001); m.scale.z = m.userData.b[5] * Math.max(p, .001); });
  // roof slab drops and lands at 9.05 with a squash
  const rp = lin(t, 8.45, 9.05); roof.visible = t > 8.4; roof.position.y = Y0 + 10.2 + 30 * Math.pow(1 - rp, 2.2);
  const sq = t > 9.05 ? Math.exp(-(t - 9.05) * 9) * Math.sin((t - 9.05) * 26) * .22 : 0;
  roof.scale.set(1, 1 - sq, 1);
}
let ready = false;
window.render = t => {
  pose(t); setCam(t); root.updateMatrixWorld(true);
  R.render(scene, cam);
  background();
  // soft board shadow
  const [bx, by] = scr(10, -3.1, 15); g.save(); g.translate(bx, by + 60); g.scale(1, .32);
  const rg = g.createRadialGradient(0, 0, 10, 0, 0, 560); rg.addColorStop(0, 'rgba(60,44,70,.20)'); rg.addColorStop(1, 'rgba(60,44,70,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(0, 0, 560, 0, 7); g.fill(); g.restore();
  g.drawImage(gl, 0, 0, W, H);
  // plot boundary: dashed ink line on the plinth edge
  const bd = lin(t, .7, 1.4) * (1 - lin(t, 7.6, 8.1)); if (bd > 0) {
    const cs = [[0, Y0, 0], [20, Y0, 0], [20, Y0, 30], [0, Y0, 30]].map(p => scr(...p));
    g.strokeStyle = INK; g.lineWidth = 2; g.setLineDash([10, 8]); g.globalAlpha = .55 * bd; g.beginPath(); cs.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.closePath(); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
  }
  // 20 ft / 30 ft, drawn as the voice says them
  dimLine([0, 0, 31.5], [20, 0, 31.5], '20 ft', lin(t, .95, 1.75), 1);
  dimLine([21.5, 0, 0], [21.5, 0, 30], '30 ft', lin(t, 1.45, 2.25), 1);
  // room pins (leaders retract before the walls rise and the roof lands)
  for (const R_ of ROOMS) {
    const [x0, z0, x1, z1] = R_.r; let cx = (x0 + x1) / 2, cz = (z0 + z1) / 2; if (R_.k === 'stairs') { cx = 5; cz = 25.5; }
    const [sx, sy] = scr(cx, Y0 + .1, cz);
    const p = lin(t, R_.t + .1, R_.t + .8) * (1 - lin(t, 7.35, 7.75));
    pin(sx, sy, R_.up, R_.dir, R_.n, p);
  }
  // header: tiny style label + note
  g.globalAlpha = .9; isoCube(64, 168, 11); g.globalAlpha = 1;
  halo('STYLE 02 · ISOMETRIC 3D HOUSE', 90, 168, F(600, 25), 'rgba(43,36,51,.78)', 0, 'left', 3.2);
  g.fillStyle = 'rgba(43,36,51,.35)'; g.fillRect(64, 198, 300, 2);
  const np = lin(t, 1.6, 2.2); if (np > 0) { g.globalAlpha = np; halo('Example layout', 64, 1312, F(500, 27), 'rgba(43,36,51,.7)', 5, 'left', 0.5); g.globalAlpha = 1; }
  caption(t);
};
await document.fonts.load('600 30px Inter'); await document.fonts.load('500 30px Inter');
window.render(0); window.READY = true;
</script></body></html>
