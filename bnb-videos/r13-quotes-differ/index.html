// R13 "Ask BNB: why do quotes differ". One page per line; one orange idea per page; the slam is LINE BY LINE (L05).
function hat(t0, d, cx, cy, s = 1, o = {}) { // hard hat, no face
  S(t0, t0 + d * .6, L.arcPts(cx, cy, 52 * s, 46 * s, Math.PI, Math.PI * 2, 20), Object.assign({ w: 7 }, o));
  S(t0 + d * .6, t0 + d * .85, [[cx - 74 * s, cy + 2], [cx + 74 * s, cy]], Object.assign({ w: 8, smooth: false, quiet: true }, o));

}

  const END = T.total - 2.5;
  // ---- p1 · L01: the question; one house, three quotes; orange "?"

      line(t0 + .3, .08, [x + 25, 1180], [x + 195, 1180], { w: 3.5, quiet: true });
      squig(t0 + .35, .15, x + 25, 1225, [80, 170, 120][i], { w: 6, quiet: true }); });
    Wr(wt('L01', 'quotes') - .1, '?', 800, 880, { size: 190, col: OR, cps: 6 });
  });
  // ---- p2 · L02: not the same house: three different houses on three quotes; orange =/=
  scene(4.65, () => {
    Wr(4.85, 'Usually…', 150, 350, { size: 74 });
    const xs = [150, 425, 700], tq = wt('L02', 'quotes');
    xs.forEach((x, i) => { sheet(tq - .5 + i * .12, .3, x, 450, 230, 600); Wr(tq - .35 + i * .12, 'Quote ' + 'ABC'[i], x + 24, 520, { size: 44, cps: 26 }); });
    const th = tq + .1;
    house(th, .4, 265, 760, .7);
    rect(th + .2, .2, 495, 700, 140, 62); house(th + .3, .35, 565, 700, .7, { nowin: true });

    [4, 2, 3].forEach((n, i) => { for (let k = 0; k < n; k++) squig(th + .5 + i * .1 + k * .06, .1, xs[i] + 28, 840 + k * 55, 160 - (k % 2) * 40, { w: 3.5, quiet: true }); });

    sheet(8.0, .35, 170, 330, 340, 680); sheet(8.15, .35, 570, 330, 340, 680);

  // ---- p5 · L05: THE SLAM: totals crossed out, LINE BY LINE
  scene(18.40, () => {

    const xs = [160, 420, 680];

    const tt = wt('L05', 'totals');
    xs.forEach((x, i) => line(tt + i * .1, .12, [x + 18, 655], [x + 222, 585], { w: 9, kind: 'cross' }));
    stamp(wt('L05', 'line'), 'LINE BY LINE', 540, 940, { size: 150, rot: -.08 });
    [1130, 1200, 1270].forEach((y, k) => { dashed(wt('L05', 'line') + .35 + k * .06, .3, [170, y], [910, y], { n: 10, w: 4, col: BLUE, quiet: k > 0 });
      [300, 540, 780].forEach((x, i) => tick(wt('L05', 'line') + .6 + k * .08 + i * .03, x, y - 20, .7, { quiet: true })); });
  });
  // ---- p6 · L06: same list, same drawing: an aligned table (orange: one drawing feeds every column)
  scene(21.84, () => {
    Wr(wt('L06', 'ask') - .05, 'Ask each contractor', 150, 350, { size: 60, cps: 24 });
    const cxs = [545, 715, 885], top = 690, rh = 110;
    cxs.forEach((x, i) => { hat(wt('L06', 'contractor') + i * .1, .25, x, 600, .55); Wr(wt('L06', 'contractor') + .2 + i * .1, 'ABC'[i], x, 670, { size: 48, align: 'center', cps: 20 }); });
    const tg = wt('L06', 'quote');
    for (let k = 0; k <= 4; k++) line(tg + k * .06, .12, [150, top + k * rh], [965, top + k * rh], { w: 4, quiet: k > 0 });

    Wr(wt('L06', 'same') - .05, 'same list,', 168, 465, { size: 50, cps: 24 });
