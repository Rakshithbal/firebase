<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"series","type":"string","label":"Series tag","default":"Buildpedia"},
    {"id":"title","type":"string","label":"Episode title","default":"What curing means"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP vendored locally: the client's network blocks public CDNs. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <!-- Word timings from timing_michael.json (generated by tools/gen.py). -->
    <script src="assets/timing.js"></script>
    <!-- Editorial design system: tokens + type classes + SVG/motion helpers. See DESIGN.md. -->
    <link rel="stylesheet" href="assets/bnb.css" />
    <script src="assets/bnb.js"></script>
    <style>
      /* OFL fonts, shipped in assets/fonts (from @fontsource). */
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-var-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; font-display: block; }
      @font-face { font-family: "InterVar"; src: url("assets/fonts/Inter-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Plex Mono"; src: url("assets/fonts/IBMPlexMono-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: "Plex Mono"; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
      @font-face { font-family: "Plex Mono"; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b2139; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "InterVar", Inter, sans-serif; color: #eef3fa; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="47.73" data-fps="30" data-width="1080" data-height="1920">
      <!-- Ground: navy page, blueprint grid, vignette, slow drift -->
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html"
        data-start="0" data-duration="47.73" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Scenes, back to back on one lane. Each scene file owns its entrance and exit. -->
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html"
        data-start="0" data-duration="4.673" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html"
        data-start="4.673" data-duration="4.668" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html"
        data-start="9.341" data-duration="6.435" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html"
        data-start="15.776" data-duration="10.424" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html"
        data-start="26.2" data-duration="8.009" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html"
        data-start="34.209" data-duration="10.249" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s7" data-composition-id="s7" data-composition-src="compositions/s7.html"
        data-start="44.458" data-duration="3.272" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>

      <!-- Series rail + chapter progress + grain, whole film -->
      <div id="chrome" data-composition-id="chrome" data-composition-src="compositions/chrome.html"
        data-start="0" data-duration="47.73" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 40"></div>

      <!-- Editorial subtitles, sentence-level, generated from timing.json by tools/gen.py -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="47.73" data-track-index="3" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 50"></div>

      <!-- The finished mix (am_michael narration + music + SFX), audio_michael/make_audio.py -->
      <audio id="mix" class="clip" src="audio_michael/final_mix.wav" data-start="0" data-duration="47.73"
        data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
