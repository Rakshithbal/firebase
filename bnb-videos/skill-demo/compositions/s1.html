<!doctype html>
<html lang="en">
  <body>
    <template>
      <!-- s1 · title · "A Claude Code skill" / "Editorial explainers, built in code." + a 12-column rule draws on.
           One orange idea: "built in code." -->
      <div id="root" data-composition-id="s1" data-duration="3.75">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; color: #eef3fa; }
          #s1-cam, #s1-zoom { position: absolute; inset: 0; }
          #s1-zoom { transform-origin: 960px 540px; }
          #s1-head { top: 352px; }
          #s1-head .bnb-kicker { margin-bottom: 26px; }
          #s1-hl { max-width: none; white-space: nowrap; }
        </style>
        <div id="s1-cam" class="bnb-stage">
          <div id="s1-zoom" class="bnb-stage">
            <svg id="s1-fig" class="bnb-fig" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs></defs></svg>
            <header class="bnb-head" id="s1-head">
              <div class="bnb-kicker" id="s1-kicker">A Claude Code skill</div>
              <h1 class="bnb-headline is-hero" id="s1-hl">Editorial explainers,<br /><em id="s1-em">built in code.</em></h1>
            </header>
          </div>
        </div>
        <script>
          (function () {
            var B = BNB, C = B.C, E = B.E, SC = B.scene("s1");
            var svg = document.getElementById("s1-fig"), fig = B.g(svg, { id: "s1-figure" });
            /* the 12-column rule: a hairline across the content width + a tick on every column edge */
            var y = 724;
            var rule = B.line(fig, 96, y, 1824, y, { stroke: C.chalk3, "stroke-width": 1.5, pathLength: 1 });
            var ticks = [];
            for (var i = 0; i < 12; i++) {
              ticks.push(B.line(fig, B.col(i), y - 9, B.col(i), y + 9, { stroke: C.chalk3, "stroke-width": 1.5 }));
              ticks.push(B.line(fig, B.colEnd(i), y - 5, B.colEnd(i), y + 5, { stroke: C.chalk4, "stroke-width": 1.5 }));
            }
            var words = B.words(document.getElementById("s1-hl"));

            var tl = gsap.timeline({ paused: true });
            B.a.drift(tl, "#s1-cam", SC.dur, { y1: -10 });
            tl.fromTo("#s1-zoom", { scale: 1.035 }, { scale: 1, duration: 2.4, ease: E.land }, 0);
            B.a.kicker(tl, "#s1-kicker", 0.15);
            B.a.words(tl, words.slice(0, 2), 0.35, { dur: 0.6, stagger: 0.12 });
            // the point lands on the downbeat (1.25 s = beat 3)
            B.a.words(tl, words.slice(2), 1.2, { dur: 0.6, stagger: 0.1 });
            B.a.draw(tl, rule, 1.0, 1.3, E.land);
            tl.fromTo(ticks, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: E.enter, stagger: 0.03 }, 1.15);
            B.a.exit(tl, "#s1-cam", SC.dur - 0.25, 0.22);
            window.__timelines["s1"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
