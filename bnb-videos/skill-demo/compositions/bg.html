<!doctype html>
<html lang="en">
  <body>
    <template>
      <!-- Ground (16:9): flat navy page + blueprint grid (major line on x = 96) + lift + vignette. DESIGN.md §8 -->
      <div id="root" data-composition-id="bg" data-duration="30">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; background: #0b2139; }
          #bg-cam { position: absolute; inset: 0; }
          /* minor 24 px, major 96 px; the tile origin sits on x = 0 so a major line falls on x = 96 */
          #bg-grid { position: absolute; left: -192px; top: -192px; width: 2400px; height: 1536px;
            background-image:
              linear-gradient(rgba(238,243,250,0.055) 1.5px, transparent 1.5px),
              linear-gradient(90deg, rgba(238,243,250,0.055) 1.5px, transparent 1.5px),
              linear-gradient(rgba(238,243,250,0.026) 1px, transparent 1px),
              linear-gradient(90deg, rgba(238,243,250,0.026) 1px, transparent 1px);
            background-size: 96px 96px, 96px 96px, 24px 24px, 24px 24px; }
          #bg-lift { position: absolute; inset: 0; background: radial-gradient(48% 52% at 56% 52%, rgba(22, 56, 96, 0.55) 0%, rgba(22, 56, 96, 0) 100%); }
          #bg-vignette { position: absolute; inset: 0; background: radial-gradient(80% 90% at 50% 48%, rgba(6,22,42,0) 58%, rgba(6,22,42,0.72) 100%); }
        </style>
        <div id="bg-cam"><div id="bg-grid"></div></div>
        <div id="bg-lift"></div>
        <div id="bg-vignette"></div>
        <script>
          (function () {
            var tl = gsap.timeline({ paused: true });
            // constant, barely-there drift (linear is the point)
            tl.fromTo("#bg-grid", { x: 0, y: 0 }, { x: -48, y: -24, duration: 30, ease: "none" }, 0);
            // parallax nudge of the grid at each seam: the camera moves with the cut
            tl.fromTo("#bg-cam", { x: 0, y: 0 }, { x: 0, y: 0, duration: 0.01 }, 0);
            var cuts = [[3.75, -24, 0], [8.4375, 0, -24], [13.125, -48, 0], [22.5, 0, 24], [26.875, 24, 0]];
            var cx = 0, cy = 0;
            cuts.forEach(function (c) {
              cx += c[1]; cy += c[2];
              tl.to("#bg-cam", { x: cx, y: cy, duration: 0.8, ease: "power2.inOut" }, c[0] - 0.3);
            });
            window.__timelines["bg"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
