<!doctype html>
<html lang="en">
  <body>
    <template>
      <!-- s3 · 02 — System · "A design system, not a template." Type specimen, five palette chips, and the 12-column grid
           snapping onto a slab section. One orange idea: the "The point" chip. -->
      <div id="root" data-composition-id="s3" data-duration="4.6875">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; color: #eef3fa; }
          #s3-cam { position: absolute; inset: 0; }
          #s3-hl { white-space: nowrap; max-width: none; }
          #s3-spec { position: absolute; left: 96px; top: 372px; display: flex; gap: 0; }
          .s3-sp { width: 284px; }
          .s3-aa { font-size: 132px; line-height: 150px; color: #eef3fa; }
          .s3-aa.f1 { font-family: var(--f-serif); font-weight: 560; font-variation-settings: "opsz" 144; letter-spacing: -0.03em; }
          .s3-aa.f2 { font-family: var(--f-sans); font-weight: 500; letter-spacing: -0.03em; }
          .s3-aa.f3 { font-family: var(--f-mono); font-weight: 500; letter-spacing: -0.02em; }
          .s3-nm { margin-top: 10px; font-family: var(--f-mono); font-weight: 600; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; color: #eef3fa; white-space: nowrap; }
          .s3-ro { margin-top: 6px; font-family: var(--f-mono); font-weight: 500; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; color: #8fb3da; white-space: nowrap; }
          #s3-chips { position: absolute; left: 96px; top: 690px; display: flex; }
          .s3-chip { width: 172px; }
          .s3-sw { width: 122px; height: 122px; box-shadow: inset 0 0 0 1.5px rgba(238,243,250,0.44); }
          .s3-cl { margin-top: 16px; font-family: var(--f-mono); font-weight: 500; font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase; color: #8fb3da; white-space: nowrap; }
          .s3-cl.pt { color: #ff8a3d; font-weight: 600; }
          #s3-grid { position: absolute; inset: 0; }
          .s3-band { position: absolute; top: 120px; height: 820px; width: 122px; background: rgba(143,179,218,0.05);
            box-shadow: inset 1px 0 0 rgba(143,179,218,0.28), inset -1px 0 0 rgba(143,179,218,0.28); transform-origin: 50% 0; }
          #s3-figcap { top: 962px; }
        </style>
        <div id="s3-cam" class="bnb-stage">
          <div id="s3-grid" data-layout-ignore></div>
          <svg id="s3-fig" class="bnb-fig" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs></defs></svg>
          <header class="bnb-head" id="s3-head">
            <div class="bnb-kicker" id="s3-kicker"><b>02</b> — System</div>
            <h1 class="bnb-headline" id="s3-hl">A design system, not a template.</h1>
          </header>

          <div id="s3-spec">
            <div class="s3-sp"><div class="s3-aa f1">Aa</div><div class="s3-nm">Fraunces</div><div class="s3-ro">Headlines</div></div>
            <div class="s3-sp"><div class="s3-aa f2">Aa</div><div class="s3-nm">Inter</div><div class="s3-ro">Body</div></div>
            <div class="s3-sp"><div class="s3-aa f3">Aa</div><div class="s3-nm">Plex Mono</div><div class="s3-ro">Labels</div></div>
          </div>

          <div id="s3-chips">
            <div class="s3-chip"><div class="s3-sw" style="background:#0b2139"></div><div class="s3-cl">Navy</div></div>
            <div class="s3-chip"><div class="s3-sw" style="background:#eef3fa"></div><div class="s3-cl">Chalk</div></div>
            <div class="s3-chip"><div class="s3-sw" style="background:#ff8a3d"></div><div class="s3-cl pt">The point</div></div>
            <div class="s3-chip"><div class="s3-sw" style="background:#4fc3f7"></div><div class="s3-cl">Water</div></div>
            <div class="s3-chip"><div class="s3-sw" style="background:#7ce0a3"></div><div class="s3-cl">Strength</div></div>
          </div>

          <div class="bnb-figcap" id="s3-figcap">
            <div class="rule"></div>
            <div class="txt"><span class="num">Fig. 1</span><span class="sep">·</span><span class="desc">Section through a fresh RCC slab</span></div>
          </div>
        </div>
        <script>
          (function () {
            var B = BNB, C = B.C, E = B.E, SC = B.scene("s3");
            var svg = document.getElementById("s3-fig"), fig = B.g(svg, { id: "s3-figure" });

            /* 12-column grid overlay: one band per column (built at init, animated below) */
            var grid = document.getElementById("s3-grid"), bands = [];
            for (var i = 0; i < 12; i++) {
              var d = document.createElement("div"); d.className = "s3-band"; d.id = "s3-band-" + i;
              d.style.left = B.col(i) + "px"; grid.appendChild(d); bands.push(d);
            }

            /* slab section on columns 8–12 */
            var slab = B.slab(svg, fig, { id: "s3-slab", seed: 7, x0: B.col(7), x1: B.colEnd(11), top: 604, th: 128, ground: 872, pier: { w: 104, inset: 40 } });
            var b = slab.bounds;
            var span = B.dim(fig, { x1: b.x0, y1: 556, x2: b.x1, y2: 556, ext: 36, label: "Span" });
            var depth = B.dim(fig, { x1: b.x0 - 44, y1: b.top, x2: b.x0 - 44, y2: b.bot, ext: 32, label: "Depth" });
            // snap marks: blue hairlines on the two column edges the slab lands on
            var snapL = B.line(fig, b.x0, 140, b.x0, 930, { stroke: C.blue, "stroke-width": 1.5, "stroke-opacity": 0.8, pathLength: 1 });
            var snapR = B.line(fig, b.x1, 140, b.x1, 930, { stroke: C.blue, "stroke-width": 1.5, "stroke-opacity": 0.8, pathLength: 1 });

            var hlw = B.words(document.getElementById("s3-hl"));
            var tl = gsap.timeline({ paused: true });
            B.a.drift(tl, "#s3-cam", SC.dur, { y1: -10 });
            B.a.kicker(tl, "#s3-kicker", 0.05);
            B.a.words(tl, hlw, 0.12, { stagger: 0.06 });
            // type specimen
            tl.fromTo(".s3-sp", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: E.enter, stagger: 0.12 }, 0.35);
            // palette chips: swatch first, then its label
            tl.fromTo(".s3-sw", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.45, ease: E.enter, stagger: 0.08 }, 0.95);
            tl.fromTo(".s3-cl", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: E.enter, stagger: 0.08 }, 1.08);
            // slab draws
            B.a.draw(tl, [slab.outline, slab.surface], 1.3, 0.9);
            B.a.draw(tl, [slab.ground.line, slab.ground.hatch], 1.3, 0.8);
            tl.fromTo([slab.body, slab.agg, slab.sand, slab.dist, slab.shade].concat(slab.piers.map(function (p) { return p.g; })),
              { opacity: 0 }, { opacity: 1, duration: 0.6, ease: E.enter }, 1.55);
            B.a.popIn(tl, slab.rebar, 1.8, { stagger: 0.04, dur: 0.3 });
            // the grid arrives loose, then snaps onto the columns
            bands.forEach(function (d, i) {
              var off = (i % 2 ? 1 : -1) * (14 + (i % 3) * 8);
              tl.fromTo(d, { opacity: 0, scaleY: 0, x: off }, { opacity: 1, scaleY: 1, x: off, duration: 0.5, ease: E.land }, 1.95 + i * 0.025);
              tl.to(d, { x: 0, duration: 0.42, ease: E.land }, 2.6);
            });
            B.a.draw(tl, [snapL, snapR], 2.66, 0.5, E.land);
            tl.to(bands, { opacity: 0.45, duration: 0.6, ease: E.move }, 3.2);
            tl.to([snapL, snapR], { opacity: 0.35, duration: 0.6, ease: E.move }, 3.3);
            [span, depth].forEach(function (dm, k) {
              B.a.draw(tl, [dm.ext, dm.line], 2.9 + k * 0.1, 0.6);
              tl.fromTo([dm.ticks, dm.label], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: E.enter }, 3.2 + k * 0.1);
            });
            B.a.figcap(tl, document.getElementById("s3-figcap"), 3.0);
            B.a.exit(tl, "#s3-cam", SC.dur - 0.25, 0.22);
            window.__timelines["s3"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
