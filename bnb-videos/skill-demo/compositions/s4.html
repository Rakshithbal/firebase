<!doctype html>
<html lang="en">
  <body>
    <template>
      <!-- s4 · 03 — Scenes · "Every frame drawn in code." The real R05 v2 reel (muted, pre-trimmed to five beats) plays in a
           9:16 phone frame; a mono index + callout names each scene recipe as it plays. One orange idea: the active index segment. -->
      <div id="root" data-composition-id="s4" data-duration="9.375">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; color: #eef3fa; }
          #s4-cam, #s4-left { position: absolute; inset: 0; }
          #s4-labels { position: absolute; left: 96px; top: 560px; width: 900px; height: 140px; }
          .s4-idx { position: absolute; left: 0; top: 0; font-family: var(--f-mono); font-weight: 500; font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: #8fb3da; white-space: nowrap; }
          .s4-idx b { color: #eef3fa; font-weight: 600; }
          .s4-lab { position: absolute; left: 0; top: 50px; font-family: var(--f-sans); font-weight: 500; font-size: 54px; line-height: 64px; letter-spacing: -0.015em; color: #eef3fa; white-space: nowrap; }
          #s4-segs { position: absolute; left: 96px; top: 760px; display: flex; gap: 8px; }
          .s4-seg { width: 56px; height: 4px; background: rgba(238,243,250,0.2); }
          #s4-seg-on { position: absolute; left: 96px; top: 760px; width: 56px; height: 4px; background: #ff8a3d; }
          #s4-cover { position: absolute; inset: 0; background: #0b2139; opacity: 0; }
        </style>
        <div id="s4-cam" class="bnb-stage">
          <div id="s4-left" class="bnb-stage">
            <svg id="s4-fig" class="bnb-fig" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs></defs></svg>
            <header class="bnb-head" id="s4-head">
              <div class="bnb-kicker" id="s4-kicker"><b>03</b> — Scenes</div>
              <h1 class="bnb-headline" id="s4-hl">Every frame<br />drawn in code.</h1>
            </header>
            <div id="s4-labels">
              <div class="s4-idx" id="s4-i1">Recipe <b>01</b> / 05</div>
              <div class="s4-idx" id="s4-i2">Recipe <b>02</b> / 05</div>
              <div class="s4-idx" id="s4-i3">Recipe <b>03</b> / 05</div>
              <div class="s4-idx" id="s4-i4">Recipe <b>04</b> / 05</div>
              <div class="s4-idx" id="s4-i5">Recipe <b>05</b> / 05</div>
              <div class="s4-lab" id="s4-l1">Stamp · one slam per film</div>
              <div class="s4-lab" id="s4-l2">Magnifier lens</div>
              <div class="s4-lab" id="s4-l3">Strength shortfall</div>
              <div class="s4-lab" id="s4-l4">Small multiples</div>
              <div class="s4-lab" id="s4-l5">Site record</div>
            </div>
            <div id="s4-segs"><div class="s4-seg"></div><div class="s4-seg"></div><div class="s4-seg"></div><div class="s4-seg"></div><div class="s4-seg"></div></div>
            <div id="s4-seg-on"></div>
          </div>

          <div class="bnb-phone" id="s4-phone">
            <div class="screen" id="s4-screen">
              <video id="s4-video" class="clip" src="assets/video/r05_cuts.mp4" data-start="0" data-duration="9.375"
                data-track-index="0" muted playsinline></video>
              <div id="s4-cover"></div>
            </div>
          </div>
        </div>
        <script>
          (function () {
            var B = BNB, C = B.C, E = B.E, SC = B.scene("s4");
            var svg = document.getElementById("s4-fig"), fig = B.g(svg, { id: "s4-figure" });
            var P = B.STAGE.phone;   // screen x 1104–1554, y 150–950
            // aspect dimension on the right of the phone
            var asp = B.dim(fig, { x1: 1622, y1: P.y, x2: 1622, y2: P.y + P.h, ext: -40, label: "9:16" });
            // callout leader: rule under the label → dot on the screen edge
            var rule = B.line(fig, 96, 718, 1010, 718, { stroke: C.chalk3, "stroke-width": 1.5, pathLength: 1 });
            var lead = B.path(fig, "M1010 718 L 1080 718", { stroke: C.chalk, "stroke-width": 2, pathLength: 1 });
            var halo = B.el("circle", { cx: 1080, cy: 718, r: 11, fill: C.ground, "fill-opacity": 0.85 }, fig);
            var dot = B.el("circle", { cx: 1080, cy: 718, r: 6.5, fill: C.chalk }, fig);

            var tl = gsap.timeline({ paused: true });
            B.a.drift(tl, "#s4-left", SC.dur, { y1: -12 });
            B.a.kicker(tl, "#s4-kicker", 0.05);
            B.a.words(tl, B.words(document.getElementById("s4-hl")), 0.12, { stagger: 0.07 });
            // the phone arrives (calm: blur + a small settle, no slide)
            tl.fromTo("#s4-phone", { opacity: 0, scale: 0.965, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: E.land }, 0.0);
            B.a.draw(tl, [asp.ext, asp.line], 0.5, 0.7);
            tl.fromTo([asp.ticks, asp.label], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: E.enter }, 0.9);
            B.a.draw(tl, rule, 0.45, 0.7, E.land);
            B.a.draw(tl, lead, 0.75, 0.35);
            tl.fromTo([halo, dot], { scale: 0, svgOrigin: "1080 718" }, { scale: 1, svgOrigin: "1080 718", duration: 0.25, ease: E.enter }, 1.0);
            tl.fromTo(".s4-seg", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: E.enter, stagger: 0.05 }, 0.6);
            tl.fromTo("#s4-seg-on", { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.3, ease: E.enter }, 0.7);

            // cuts in the reel (frames 56, 112, 169, 225 of the pre-trimmed clip)
            var cuts = [0, 56 / 30, 112 / 30, 169 / 30, 225 / 30];
            cuts.forEach(function (t, i) {
              var n = i + 1, tin = i === 0 ? 0.45 : t;
              tl.fromTo(["#s4-i" + n, "#s4-l" + n], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: E.enter, stagger: 0.05 }, tin);
              if (i < 4) tl.to(["#s4-i" + n, "#s4-l" + n], { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: E.exit }, cuts[i + 1] - 0.16);
              if (i > 0) tl.to("#s4-seg-on", { x: i * 64, duration: 0.35, ease: E.move }, t - 0.05);
            });
            // exit: the left column blurs out; the phone holds still (s5 picks it up in place); the screen dips to ground
            tl.to("#s4-cover", { opacity: 1, duration: 0.25, ease: E.exit }, SC.dur - 0.28);
            B.a.exit(tl, "#s4-left", SC.dur - 0.28, 0.24);
            window.__timelines["s4"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
