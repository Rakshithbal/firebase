<!doctype html>
<html lang="en">
  <body>
    <template>
      <!-- s5 · 04 — Theming · "Any series. Any client." The same phone (match cut from s4) now shows a code-built page;
           the series rail swaps BUILDPEDIA → LOAN LENS → FIX IT BEFORE IT SPREADS → YOUR BRAND and, on the last swap,
           every token re-themes (ground, line, accent, wordmark). One orange idea: the accent swatch (it becomes the client's). -->
      <div id="root" data-composition-id="s5" data-duration="4.375">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; color: #eef3fa; }
          #s5-cam, #s5-left { position: absolute; inset: 0; }
          #s5-series { position: absolute; left: 96px; top: 556px; width: 960px; height: 120px; }
          .s5-k { font-family: var(--f-mono); font-weight: 500; font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: #8fb3da; white-space: nowrap; }
          .s5-sn { position: absolute; left: 0; top: 46px; font-family: var(--f-mono); font-weight: 600; font-size: 46px; line-height: 56px; letter-spacing: 0.08em; text-transform: uppercase; color: #eef3fa; white-space: nowrap; }
          #s5-tokens { position: absolute; left: 96px; top: 742px; display: flex; gap: 24px; }
          .s5-tok { width: 146px; }
          .s5-sw { width: 96px; height: 96px; box-shadow: inset 0 0 0 1.5px rgba(238,243,250,0.44); }
          .s5-tl { margin-top: 14px; font-family: var(--f-mono); font-weight: 500; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; color: #8fb3da; white-space: nowrap; }

          /* the page inside the phone: every colour is a token, so a client theme is a token swap */
          #s5-page { position: absolute; inset: 0; --pg-ground: #0b2139; --pg-ink: #eef3fa; --pg-mid: #627387; --pg-accent: #ff8a3d; --pg-dot: #4fc3f7; --pg-grid: rgba(238,243,250,0.05);
            background-color: var(--pg-ground);
            background-image: linear-gradient(var(--pg-grid) 1px, transparent 1px), linear-gradient(90deg, var(--pg-grid) 1px, transparent 1px);
            background-size: 30px 30px; background-position: 30px 0; }
          .pg-rail { position: absolute; left: 30px; top: 64px; display: flex; align-items: center; gap: 9px; white-space: nowrap;
            font-family: var(--f-mono); font-weight: 600; font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--pg-ink); }
          .pg-rail i { width: 5px; height: 5px; border-radius: 3px; background: var(--pg-dot); }
          .pg-kick { position: absolute; left: 30px; top: 118px; font-family: var(--f-mono); font-weight: 500; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--pg-ink); opacity: 0.7; }
          .pg-hl { position: absolute; left: 30px; top: 146px; width: 400px; font-family: var(--f-serif); font-weight: 560; font-size: 50px; line-height: 52px; letter-spacing: -0.025em;
            font-variation-settings: "opsz" 144; color: var(--pg-ink); }
          .pg-hl em { font-style: italic; font-weight: 500; color: var(--pg-accent); }
          #s5-pgfig { position: absolute; left: 0; top: 0; width: 450px; height: 800px; overflow: visible; }
          .pg-cap { position: absolute; left: 30px; top: 652px; width: 390px; border-top: 1.5px solid var(--pg-ink); padding-top: 10px; opacity: 0.6;
            font-family: var(--f-mono); font-weight: 600; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pg-ink); white-space: nowrap; }
          .pg-mark { position: absolute; left: 30px; top: 724px; white-space: nowrap; color: var(--pg-ink); }
          #s5-mark1 { font-family: var(--f-mono); font-weight: 600; font-size: 16px; letter-spacing: 0.22em; }
          #s5-mark2 { font-family: var(--f-serif); font-style: italic; font-weight: 600; font-size: 26px; letter-spacing: -0.01em; top: 716px; color: var(--pg-accent); }
        </style>
        <div id="s5-cam" class="bnb-stage">
          <div id="s5-left" class="bnb-stage">
            <header class="bnb-head" id="s5-head">
              <div class="bnb-kicker" id="s5-kicker"><b>04</b> — Theming</div>
              <h1 class="bnb-headline" id="s5-hl">Any series.<br />Any client.</h1>
            </header>
            <div id="s5-series">
              <div class="s5-k" id="s5-series-k">Series</div>
              <div class="s5-sn" id="s5-sn1">Buildpedia</div>
              <div class="s5-sn" id="s5-sn2">Loan Lens</div>
              <div class="s5-sn" id="s5-sn3">Fix it before it spreads</div>
              <div class="s5-sn" id="s5-sn4">Your brand</div>
            </div>
            <div id="s5-tokens">
              <div class="s5-tok"><div class="s5-sw" id="s5-sw-g" style="background-color:#0b2139"></div><div class="s5-tl">Ground</div></div>
              <div class="s5-tok"><div class="s5-sw" id="s5-sw-i" style="background-color:#eef3fa"></div><div class="s5-tl">Line</div></div>
              <div class="s5-tok"><div class="s5-sw" id="s5-sw-a" style="background-color:#ff8a3d"></div><div class="s5-tl">Accent</div></div>
            </div>
          </div>

          <div class="bnb-phone" id="s5-phone">
            <div class="screen">
              <div id="s5-page">
                <div class="pg-rail" id="s5-r1"><span>Buildpedia</span><i></i></div>
                <div class="pg-rail" id="s5-r2"><span>Loan Lens</span><i></i></div>
                <div class="pg-rail" id="s5-r3"><span>Fix it before it spreads</span><i></i></div>
                <div class="pg-rail" id="s5-r4"><span>Your brand</span><i></i></div>
                <div class="pg-kick" id="s5-pk">01 — Episode</div>
                <div class="pg-hl" id="s5-h1">What <em>curing</em> means</div>
                <div class="pg-hl" id="s5-h2">Loan <em>stages</em>, plainly</div>
                <div class="pg-hl" id="s5-h3">Terrace <em>cracks</em></div>
                <div class="pg-hl" id="s5-h4">Your topic, <em>your look</em></div>
                <svg id="s5-pgfig" viewBox="0 0 450 800" xmlns="http://www.w3.org/2000/svg"><defs></defs></svg>
                <div class="pg-cap" id="s5-cap">Fig. 1 · Section</div>
                <div class="pg-mark" id="s5-mark1">BUYNBUILD</div>
                <div class="pg-mark" id="s5-mark2">Your Brand</div>
              </div>
            </div>
          </div>
        </div>
        <script>
          (function () {
            var B = BNB, C = B.C, E = B.E, SC = B.scene("s5");
            /* page figure: a small slab section on two piers over ground + a strength bar; colours read the page tokens */
            var svg = document.getElementById("s5-pgfig"), g = B.g(svg, { id: "s5-pg" });
            var ink = "var(--pg-ink)", acc = "var(--pg-accent)";
            var st = function (e, s, w) { e.style.stroke = s; if (w) e.style.strokeWidth = w; return e; };
            var body = B.el("rect", { x: 40, y: 452, width: 290, height: 62 }, g); body.style.fill = "var(--pg-mid)";
            st(B.path(g, "M40 452H330V514H40Z", { "stroke-width": 3.5 }), ink);
            for (var k = 0; k < 6; k++) { var c = B.el("circle", { cx: 62 + k * 49, cy: 497, r: 5.5, "stroke-width": 2.5 }, g); c.style.fill = "var(--pg-ground)"; st(c, ink); }
            st(B.path(g, "M62 514V590H104V514M266 514V590H308V514", { "stroke-width": 2.5 }), ink);
            st(B.path(g, "M24 590H350", { "stroke-width": 2.5 }), ink);
            var gh = ""; for (var x = 30; x < 350; x += 14) gh += "M" + x + " 594l-10 14";
            st(B.path(g, gh, { "stroke-width": 1.2, "stroke-opacity": 0.5 }), ink);
            // strength bar with an accent shortfall bracket (the page's one accent idea)
            st(B.path(g, "M374 590V420H404V590Z", { "stroke-width": 2.5 }), ink);
            var fill = B.el("rect", { x: 379, y: 488, width: 20, height: 97 }, g); fill.style.fill = "var(--pg-ink)"; fill.style.fillOpacity = 0.35;
            st(B.path(g, "M366 425H412", { "stroke-width": 2, "stroke-dasharray": "5 5" }), ink);
            st(B.path(g, "M414 428H424V486H414", { "stroke-width": 3.5 }), acc);

            var tl = gsap.timeline({ paused: true });
            B.a.drift(tl, "#s5-left", SC.dur, { y1: -10 });
            B.a.kicker(tl, "#s5-kicker", 0.05);
            B.a.words(tl, B.words(document.getElementById("s5-hl")), 0.12, { stagger: 0.08 });
            // phone holds its place from s4; the page builds inside the screen
            tl.fromTo("#s5-page", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: E.enter }, 0.0);
            tl.fromTo(["#s5-pk", "#s5-pg", "#s5-mark1"], { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: E.enter, stagger: 0.06 }, 0.12);
            tl.fromTo("#s5-cap", { opacity: 0 }, { opacity: 0.6, duration: 0.4, ease: E.enter, immediateRender: false }, 0.3);
            tl.fromTo("#s5-series-k", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: E.enter }, 0.3);
            tl.fromTo("#s5-tokens .s5-tok", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: E.enter, stagger: 0.07 }, 0.45);

            // the series swaps (beat grid: 0.625 s): rail, page headline and the big series name change together
            var T = [0.1, 0.95, 1.7, 2.5], dots = ["#4fc3f7", "#7ce0a3", "#f2c08a", "#0f7b6c"];
            T.forEach(function (t, i) {
              var n = i + 1, set = ["#s5-r" + n, "#s5-h" + n, "#s5-sn" + n];
              tl.fromTo(set, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.32, ease: E.enter, stagger: 0.04 }, t);
              if (i < 3) tl.to(set, { opacity: 0, filter: "blur(8px)", duration: 0.14, ease: E.exit }, T[i + 1] - 0.14);
              if (i > 0 && i < 3) tl.to("#s5-page", { "--pg-dot": dots[i], duration: 0.3, ease: E.move }, t);
            });
            // client theme: every token moves at once on the last swap
            var t4 = T[3];
            tl.to("#s5-page", { "--pg-ground": "#f3eee4", "--pg-ink": "#1d2a36", "--pg-mid": "#c9c1b3", "--pg-accent": "#0f7b6c", "--pg-dot": "#0f7b6c",
              "--pg-grid": "rgba(29,42,54,0.07)", duration: 0.6, ease: E.move }, t4);
            tl.to("#s5-sw-g", { backgroundColor: "#f3eee4", duration: 0.6, ease: E.move }, t4 + 0.05);
            tl.to("#s5-sw-i", { backgroundColor: "#1d2a36", duration: 0.6, ease: E.move }, t4 + 0.1);
            tl.to("#s5-sw-a", { backgroundColor: "#0f7b6c", duration: 0.6, ease: E.move }, t4 + 0.15);
            tl.to("#s5-mark1", { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: E.exit }, t4);
            tl.fromTo("#s5-mark2", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: E.enter }, t4 + 0.2);
            B.a.exit(tl, "#s5-cam", SC.dur - 0.25, 0.22);
            window.__timelines["s5"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
