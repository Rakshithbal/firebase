<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// BNB logo opener — 2.0 s, editorial blueprint style. renderAt(t) is a pure function of time.
const P = { ground:'#0b2139', grid:'rgba(143,179,218,0.09)', gridMajor:'rgba(143,179,218,0.17)',
            chalk:'#eef3fa', blue:'#8fb3da', orange:'#EF4B06' };
const W = +(new URLSearchParams(location.search).get('w') || 1080);
const H = +(new URLSearchParams(location.search).get('h') || 1920);
const c = document.getElementById('c'); c.width = W; c.height = H; const ctx = c.getContext('2d');
const mark = new Image(); mark.src = 'assets/bnb_mark_white.png';
const tag = new Image(); tag.src = 'assets/tagline_white.png';
window.ready = Promise.all([mark, tag].map(i => i.decode()));
const clamp = (x) => Math.max(0, Math.min(1, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut3 = (x) => 1 - Math.pow(1 - x, 3);
const eExpo = (x) => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInOut = (x) => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;

// roof chevron in mark-image pixels (945 x 431): left end, apex, right end
const ROOF = [[300, 158], [464, 42], [628, 158]];

function polyDraw(pts, p, width, color) {
  if (p <= 0) return; let tot = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); seg.push(d); tot += d; }
  let rem = tot * p; ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  for (let i = 1; i < pts.length && rem > 0; i++) { const f = Math.min(1, rem / seg[i-1]);
    ctx.lineTo(pts[i-1][0] + (pts[i][0]-pts[i-1][0]) * f, pts[i-1][1] + (pts[i][1]-pts[i-1][1]) * f); rem -= seg[i-1]; }
  ctx.stroke(); ctx.restore();
}

window.renderAt = function (t) {
  // ground + vignette
  ctx.fillStyle = P.ground; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(40,90,150,0.30)'); g.addColorStop(1, 'rgba(0,0,0,0.40)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // blueprint grid, fades in and drifts slightly
  const ga = eOut3(prog(t, 0, 0.45)); const off = t * 10; ctx.lineWidth = 1;
  ctx.globalAlpha = ga;
  for (let x = (W/2) % 24 - 24 + off % 24; x < W + 24; x += 24) { const major = Math.round((x - off % 24 - (W/2) % 24) / 24) % 4 === 0;
    ctx.strokeStyle = major ? P.gridMajor : P.grid; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = (H/2) % 24 - 24 + off % 24; y < H + 24; y += 24) { const major = Math.round((y - off % 24 - (H/2) % 24) / 24) % 4 === 0;
    ctx.strokeStyle = major ? P.gridMajor : P.grid; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.globalAlpha = 1;

  // layout: mark centred
  const mw = Math.min(W * 0.56, 640), s = mw / 945, mh = 431 * s;
  const settle = 0;
  const mx = (W - mw) / 2, my = H / 2 - mh * 0.62 + settle;

  // HOUSE: walls, door and window draw on under the roof (mark-image coords), then hand over to the letters
  const H_WALL=[[322,175],[322,425],[606,425],[606,175]], H_DOOR=[[436,425],[436,318],[492,318],[492,425]];
  const H_WIN1=[[350,215],[402,215],[402,265],[350,265],[350,215]], H_WIN2=[[526,215],[578,215],[578,265],[526,265],[526,215]];
  const H_GROUND=[[250,425],[678,425]];
  const hd = eInOut(prog(t, 0.22, 0.75)), hf = 1 - eOut3(prog(t, 0.85, 1.2));
  if (hf > 0) { ctx.save(); ctx.globalAlpha = hf; ctx.translate(mx, my); ctx.scale(s, s);
    polyDraw(H_GROUND, eOut3(prog(t, 0.0, 0.4)), 6, P.blue);
    polyDraw(H_WALL, hd, 14, P.chalk);
    polyDraw(H_DOOR, eInOut(prog(t, 0.45, 0.85)), 10, P.chalk);
    polyDraw(H_WIN1, eInOut(prog(t, 0.5, 0.85)), 8, P.chalk); polyDraw(H_WIN2, eInOut(prog(t, 0.55, 0.9)), 8, P.chalk);
    ctx.restore(); }

  // ROOF first: orange chevron draws on over the house, stays as the anchor, then turns into the logo's white roof
  const rp = eInOut(prog(t, 0.0, 0.45)); const ro = 1 - prog(t, 1.15, 1.45);
  if (ro > 0) { ctx.save(); ctx.globalAlpha = ro; ctx.translate(mx, my); ctx.scale(s, s);
    polyDraw(ROOF, rp, 30, P.orange); ctx.restore(); }

  // LETTERS: the full bnb opens out from under the roof (centre-out wipe), sharpening as the house dissolves
  const rv = eExpo(prog(t, 0.88, 1.4));
  if (rv > 0) { ctx.save(); const half = (mw / 2 + 20) * rv; ctx.beginPath(); ctx.rect(W/2 - half, my - 40, half * 2, mh + 80); ctx.clip();
    ctx.filter = `blur(${(1 - rv) * 5}px)`; ctx.globalAlpha = clamp(rv * 1.3); ctx.drawImage(mark, mx, my, mw, mh); ctx.restore(); }

  // tagline tracks in
  const tp = eOut3(prog(t, 1.35, 1.75));
  if (tp > 0) { const tw = mw * 1.0, th = tw * 33 / 943; const ty = my + mh + mh * 0.16 + 14 * (1 - tp);
    ctx.save(); ctx.globalAlpha = tp; ctx.drawImage(tag, (W - tw) / 2, ty, tw, th); ctx.restore(); }

  // short orange rule under everything, the final beat
  const up = eOut3(prog(t, 1.5, 1.85));
  if (up > 0) { const uy = my + mh + mh * 0.16 + mw * 33 / 943 + 34; ctx.save(); ctx.strokeStyle = P.orange; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(W/2 - 36 * up, uy); ctx.lineTo(W/2 + 36 * up, uy); ctx.stroke(); ctx.restore(); }
};
</script></body></html>
