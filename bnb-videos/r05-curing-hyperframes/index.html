<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"series","type":"string","label":"Series tag","default":"BUILDPEDIA"},
    {"id":"navy","type":"color","label":"Blueprint navy","default":"#0E2A47"},
    {"id":"orange","type":"color","label":"Accent orange","default":"#FF8A3D"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP vendored locally: the client's network blocks public CDNs. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <!-- Word timings from r05-curing/timing.json (generated by tools/gen.py). -->
    <script src="assets/timing.js"></script>
    <style>
      :root {
        --navy: #0e2a47;
        --navy-deep: #08192d;
        --chalk: #eaf2ff;
        --water: #4fc3f7;
        --orange: #ff8a3d;
        --green: #7ce0a3;
        --red: #ff5a5a;
        --font-display: Inter, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--navy-deep);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45.51"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- Ground: blueprint grid, drifting, with parallax nudges at the cuts -->
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html"
        data-start="0" data-duration="45.51" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Scenes, back to back on one lane; each owns its own entrance and exit -->
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html"
        data-start="0" data-duration="4.411" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html"
        data-start="4.411" data-duration="4.43" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html"
        data-start="8.841" data-duration="6.103" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html"
        data-start="14.944" data-duration="10.026" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html"
        data-start="24.97" data-duration="7.334" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html"
        data-start="32.304" data-duration="9.91" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s7" data-composition-id="s7" data-composition-src="compositions/s7.html"
        data-start="42.214" data-duration="3.296" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>

      <!-- Series tag + grain, whole film -->
      <div id="chrome" data-composition-id="chrome" data-composition-src="compositions/chrome.html"
        data-start="0" data-duration="45.51" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 40"></div>

      <!-- Burned-in word-by-word captions from timing.json -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="45.51" data-track-index="3" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 50"></div>

      <!-- The finished mix (narration + music + SFX, -14 LUFS), unchanged -->
      <audio id="mix" class="clip" src="assets/audio/final_mix.wav" data-start="0" data-duration="45.51"
        data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
